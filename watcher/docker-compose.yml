services:
  mc-wol-proxy:
    build: .
    restart: unless-stopped
    # Wake-on-LAN has to broadcast on the real LAN, so host networking stays.
    network_mode: host
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # The image has no ping binary, so ICMP needs a raw socket.
      - NET_RAW
    volumes:
      - ../config.yml:/config.yml:ro
      - ./assets:/assets:ro
      - ~/.ssh/id_ed25519:/ssh/id_ed25519:ro
      # A directory, so Docker creates it on its own and the accepted host key
      # survives a container recreate without any preparation.
      - ./state:/state
    environment:
      MC_WOL_CONFIG: /config.yml
      SERVER_SSH_KEY_PATH: /ssh/id_ed25519
      SERVER_SSH_KNOWN_HOSTS: /state/known_hosts
