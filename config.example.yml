watcher:
  listen_address: "0.0.0.0"           # "0.0.0.0" = all interfaces, or a single LAN IP
  listen_port: 25565

server:
  mac: "AA:BB:CC:DD:EE:FF"            # MAC address of the server PC
  ip: "192.168.1.100"                 # local IP (static or DHCP reserved)
  mc_port: 25565
  ssh_user: "your-username"
  ssh_key_path: ""                    # empty = platform default
  ssh_strict_host_key: "accept-new"   # "accept-new" | "yes" | "no", see SECURITY.md
  ssh_known_hosts: ""                 # empty = ssh default (~/.ssh/known_hosts)
  container_name: "minecraft"

wol:
  mode: "broadcast"                   # "broadcast" (recommended) or "unicast"
  broadcast_address: "192.168.1.255"  # only used in broadcast mode

duckdns:
  enabled: true
  domain: "your-domain"               # without .duckdns.org
  token: "your-duckdns-token"
  update_interval_hours: 6

transfer:
  enabled: false                      # true = transfer mode, false = full proxy (default)
  host: "your-domain.duckdns.org"     # public hostname players get transferred to
  port: 25566                         # port that forwards directly to the MC server
  local_networks: []                  # empty = every private IP counts as local

timeouts:
  boot_timeout: 60                    # seconds to wait for the PC to boot
  mc_ready_timeout: 30                # seconds to wait for MC port after container start

limits:
  boot_cooldown: 10                   # minimum seconds between wake attempts
  boot_failure_backoff: 60            # seconds after a failed wake, doubles each failure
  boot_max_backoff: 900               # upper limit for the failure backoff

motd:
  # \n splits the two lines the server list shows.
  sleeping: '{"text":"Server currently asleep","color":"gray","extra":[{"text":"\nJoin to wake it up","color":"green"}]}'
  starting: '{"text":"Server is starting","color":"gold","extra":[{"text":"\nGive it a moment, then join","color":"gray"}]}'
  login_wait: '{"text":"Server is waking up. Please reconnect in a moment.","color":"gold"}'
  max_players: 10
# .server-version.json appears next to this file after the first successful status probe.
