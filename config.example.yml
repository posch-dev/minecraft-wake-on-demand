watcher:
  listen_address: "0.0.0.0"         # "0.0.0.0" = all interfaces, or a single LAN IP
  listen_port: 25565
  allowed_hostnames: []              # hostnames/domains to accept; empty = auto from DuckDNS when enabled, or no filtering.

server:
  mac: "AA:BB:CC:DD:EE:FF"            # MAC address of the server PC
  ip: "192.168.1.100"                 # local IP (static or DHCP reserved)
  mc_port: 25565
  ssh_user: "your-username"
  ssh_key_path: ""                    # empty = ~/.ssh/mc-wol-proxy, its own key
  ssh_strict_host_key: "accept-new"   # "accept-new" | "yes" | "no", see SECURITY.md
  ssh_known_hosts: ""                 # empty = ssh default (~/.ssh/known_hosts)
  container_name: "minecraft"
  remote_helper: false                # true once setup-ssh installed mc-wol-remote on the server

wol:
  mode: "broadcast"                   # "broadcast" (recommended) or "unicast"
  broadcast_address: "192.168.1.255"  # only used in broadcast mode

update:
  check: true                         # look for a newer release after init, config and check, never installs

duckdns:
  enabled: true
  domain: "your-domain"               # with or without .duckdns.org, both work
  token: "your-duckdns-token"
  update_interval_hours: 6

transfer:
  enabled: false                      # true = transfer mode, false = full proxy (default)
  host: "your-domain.duckdns.org"     # public hostname players get transferred to
  port: 25566                         # port that forwards directly to the MC server
  local_networks: []                  # empty = every private IP counts as local

# Putting the server PC back to sleep. Needs remote_helper above, setup-ssh
# installs the helper script and the one sudoers line it depends on.
sleep:
  enabled: false
  idle_after: 900                     # seconds with nobody playing before sleep is considered
  confirm_delay: 60                   # seconds to wait, then check once more before acting
  grace_period: 900                   # seconds after a wake in which sleeping is never allowed
  poll_interval: 300                  # seconds between checks in transfer mode, where sessions are invisible
  action: "suspend"                   # "suspend" | "hibernate" | "shutdown" | "custom"
  command: ""                         # only used with action: custom

timeouts:
  boot_timeout: 60                    # seconds to wait for the PC to boot
  mc_ready_timeout: 30                # seconds to wait for MC port after container start

limits:
  boot_cooldown: 10                   # minimum seconds between wake attempts
  boot_failure_backoff: 60            # seconds after a failed wake, doubles each failure
  boot_max_backoff: 900               # upper limit for the failure backoff
  max_logins: 0                       # 0 = use the server's own player slots, or set a hard number
  max_per_ip: 8                       # per pool, so a household behind one NAT is not locked out

motd:
  # \n splits the two lines the server list shows.
  sleeping: '{"text":"Server currently asleep","color":"gray","extra":[{"text":"\nJoin to wake it up","color":"green"}]}'
  starting: '{"text":"Server is starting","color":"gold","extra":[{"text":"\nGive it a moment, then join","color":"gray"}]}'
  live: ''                            # empty = leave the running server's own MOTD alone
  login_wait: '{"text":"Server is waking up. Please reconnect in a moment.","color":"gold"}'
  server_full: '{"text":"Server is full. Please try again in a moment.","color":"red"}'
  max_players: 10                     # only shown until the real number is learned from the server
# .server-info.json appears next to this file after the first successful status probe.
