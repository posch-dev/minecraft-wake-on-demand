name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: watcher/go.mod
          cache-dependency-path: watcher/go.sum

      - name: Formatting
        working-directory: watcher
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        working-directory: watcher
        run: go vet ./...

      - name: Test
        working-directory: watcher
        run: go test -race ./...

      # A Raspberry Pi is the main target, so a broken arm build has to fail here.
      - name: Cross compile
        working-directory: watcher
        run: |
          set -eu
          for target in linux/amd64 linux/arm64 linux/arm windows/amd64; do
            CGO_ENABLED=0 GOOS="${target%/*}" GOARCH="${target#*/}" \
              go build -o /dev/null . && echo "ok $target"
          done

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # install.sh runs as root on other people's machines, so it gets linted.
      - name: ShellCheck
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck --version
          shellcheck watcher/install.sh .github/scripts/*.sh

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: watcher/go.mod
          cache-dependency-path: watcher/go.sum

      - name: Build the binary the fake release will serve
        working-directory: watcher
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -trimpath -ldflags="-s -w -X main.version=v0.0.0-test" \
            -o "$RUNNER_TEMP/mc-wol-proxy" .

      # Exercises the whole systemd path: download, checksum, unit, service,
      # a real status ping, the two refusal cases and the uninstall.
      - name: Install, verify, uninstall
        run: sudo -E TEST_BINARY="$RUNNER_TEMP/mc-wol-proxy" .github/scripts/test-install.sh

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and smoke test the image
        run: .github/scripts/test-docker.sh
