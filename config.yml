watcher:
  listen_port: 25565

server:
  mac: "AA:BB:CC:DD:EE:FF"           # MAC address of the server PC
  ip: "192.168.1.100"                 # local IP (static or DHCP reserved)
  mc_port: 25565
  ssh_user: "your-username"
  ssh_key_path: ""                    # empty = platform default
  container_name: "minecraft"

wol:
  mode: "unicast"                     # "unicast" (recommended) or "broadcast"
  broadcast_address: "192.168.1.255"  # only used in broadcast mode

duckdns:
  enabled: true
  domain: "your-domain"              # without .duckdns.org
  token: "your-duckdns-token"
  update_interval_hours: 6

timeouts:
  boot_timeout: 60                   # seconds to wait for the PC to boot
  mc_ready_timeout: 30               # seconds to wait for MC port after container start

motd:
  sleeping: '{"text":"Server is sleeping - connect to wake it up!","color":"yellow"}'
  starting: '{"text":"Server is starting, please wait...","color":"gold"}'
  max_players: 10
